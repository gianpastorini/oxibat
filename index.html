<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Oxibat – Oxígeno Estable para Faenas de Altura</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="img/logotrans.png">

    <!-- Estilos base -->
    <style>
        :root {
            --bg-main: #0b1120;
            --bg-light: #f5f5f5;
            --bg-card: #ffffff;
            --accent: #16a34a;
            --accent-soft: #dcfce7;
            --text-main: #111827;
            --text-muted: #6b7280;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--text-main);
            background-color: white;
        }

        a { text-decoration: none; }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        /* NAV */
        header {
            background-color: var(--bg-main);
            color: #e5e7eb;
            border-bottom: 1px solid #111827;
        }

        .nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 0;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: .75rem;
        }

        .nav-logo {
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-title {
            display: flex;
            flex-direction: column;
        }

        .nav-title span:first-child {
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            font-size: .9rem;
        }

        .nav-title span:last-child {
            font-size: .8rem;
            color: #9ca3af;
        }

        .nav-right a {
            font-size: .9rem;
            color: #e5e7eb;
            margin-left: 1.5rem;
            opacity: .85;
        }

        .nav-right a:hover { opacity: 1; }

        /* HERO */
        .hero {
            background:
                linear-gradient(rgba(15,23,42,.85), rgba(15,23,42,.9)),
                url("img/renderoxi.jpg") center/cover no-repeat;
            color: #f9fafb;
            padding: 3.5rem 0 3rem 0;
        }

        .hero-grid {
            display: grid;
            grid-template-columns: minmax(0,3fr) minmax(0,2.5fr);
            gap: 2.5rem;
            align-items: center;
        }

        .hero-kicker {
            font-size: .8rem;
            text-transform: uppercase;
            letter-spacing: .16em;
            color: #9ca3af;
            margin-bottom: .75rem;
        }

        .hero h1 {
            font-size: 2.4rem;
            line-height: 1.1;
            margin: 0 0 1rem 0;
        }

        .hero h1 span { color: #bbf7d0; }

        .hero-sub {
            font-size: .98rem;
            max-width: 30rem;
            color: #d1d5db;
            margin-bottom: 1.75rem;
        }

        .hero-badges {
            display: flex;
            flex-wrap: wrap;
            gap: .5rem;
            margin-bottom: 1.75rem;
        }

        .badge {
            font-size: .75rem;
            border-radius: 999px;
            padding: .25rem .75rem;
            border: 1px solid #374151;
            color: #e5e7eb;
        }

        .badge-accent {
            background-color: var(--accent-soft);
            color: #065f46;
            border-color: transparent;
        }

        .hero-cta {
            display: flex;
            flex-wrap: wrap;
            gap: .75rem;
            align-items: center;
        }

        .btn-primary {
            background-color: var(--accent);
            color: #ecfdf5;
            padding: .7rem 1.6rem;
            border-radius: 999px;
            font-weight: 600;
            font-size: .95rem;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: .4rem;
        }

        .btn-primary:hover { filter: brightness(1.05); }

        .hero-card {
            background-color: rgba(15,23,42,0.9);
            border-radius: .9rem;
            padding: 1.5rem 1.6rem;
            border: 1px solid #1f2937;
        }

        .hero-metrics {
            display: grid;
            grid-template-columns: repeat(2,minmax(0,1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .metric {
            border-radius: .75rem;
            background-color: #020617;
            padding: .9rem;
            border: 1px solid #111827;
        }

        .metric .value {
            display: block;
            font-weight: 600;
            font-size: 1rem;
            color: #bbf7d0;
        }

        .metric .label {
            font-size: .75rem;
            color: #9ca3af;
        }

        /* SECCIONES GENERALES */
        section { padding: 3.5rem 0; }

        section h2 {
            font-size: 1.7rem;
            margin: 0 0 .75rem 0;
            text-align: left;
        }

        .section-subtitle {
            font-size: .95rem;
            color: var(--text-muted);
            max-width: 34rem;
        }

        /* PROBLEMA */
        .problem-grid {
            display: grid;
            grid-template-columns: minmax(0,1.6fr) minmax(0,1.4fr);
            gap: 2rem;
            margin-top: 2rem;
        }

        .problem-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .problem-list li {
            margin-bottom: .85rem;
            padding-left: 1.6rem;
            position: relative;
            font-size: .95rem;
        }

        .problem-list li::before {
            content: "";
            width: 6px; height: 6px;
            border-radius: 999px;
            background-color: var(--accent);
            position: absolute;
            left: .4rem; top: .55rem;
        }

        .problem-card {
            background-color: var(--bg-light);
            border-radius: .9rem;
            padding: 1.2rem 1.4rem;
            border: 1px solid #e5e7eb;
            font-size: .9rem;
            color: var(--text-muted);
        }

        /* QUÉ ES OXIBAT */

            display: inline-block;
            font-size: .78rem;
            padding: .2rem .6rem;
            border-radius: 999px;
            background-color
